replicaCount:
  api: 1
  worker: 1
  web: 1

images:
  api:
    repository: hermes-team-api
    tag: dev
    pullPolicy: IfNotPresent
  worker:
    repository: hermes-team-worker
    tag: dev
    pullPolicy: IfNotPresent
  web:
    repository: nginx
    tag: 1.29.3-alpine
    pullPolicy: IfNotPresent
  postgres:
    repository: pgvector/pgvector
    tag: 0.8.2-pg18-trixie
    pullPolicy: IfNotPresent
  spicedb:
    repository: authzed/spicedb
    tag: v1.53.0
    pullPolicy: IfNotPresent
  minio:
    repository: minio/minio
    tag: RELEASE.2025-09-07T16-13-09Z
    pullPolicy: IfNotPresent

service:
  api:
    port: 8780
  web:
    port: 3000

config:
  environment: beta
  logLevel: INFO
  jwtIssuer: https://casdoor.example.com
  casdoorBaseUrl: https://casdoor.example.com
  casdoorClientId: hermes-team-api
  spicedbEndpoint: spicedb:50051
  minioEndpoint: http://minio:9000
  minioAccessKey: hermes_team

secrets:
  create: true
  existingSecret: ""
  data:
    TEAM_CLOUD_DATABASE_URL: ""
    TEAM_CLOUD_CASDOOR_CLIENT_SECRET: ""
    TEAM_CLOUD_SPICEDB_PRESHARED_KEY: ""
    TEAM_CLOUD_MINIO_SECRET_KEY: ""
    TEAM_CLOUD_ENCRYPTION_KEY: ""

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: hermes-team.example.com
      paths:
        - path: /
          pathType: Prefix
          service: web
        - path: /api
          pathType: Prefix
          service: api
  tls:
    enabled: true
    secretName: hermes-team-cloud-tls

persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  backup:
    size: 20Gi
    mountPath: /backups

jobs:
  migrations:
    enabled: true
    ttlSecondsAfterFinished: 600
  spicedbSchema:
    enabled: true
    ttlSecondsAfterFinished: 600
    schemaConfigMap: hermes-team-cloud-spicedb-schema
  minioBuckets:
    enabled: true
    ttlSecondsAfterFinished: 600
    buckets:
      - hermes-personal-backups
      - hermes-org-exports
      - hermes-attachments
      - hermes-document-sources
      - hermes-restore-staging

