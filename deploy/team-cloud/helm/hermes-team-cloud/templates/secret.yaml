{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hermes-team-cloud.secretName" . }}
  labels:
    {{- include "hermes-team-cloud.labels" . | nindent 4 }}
type: Opaque
stringData:
  TEAM_CLOUD_DATABASE_URL: {{ .Values.secrets.data.TEAM_CLOUD_DATABASE_URL | quote }}
  TEAM_CLOUD_CASDOOR_CLIENT_SECRET: {{ .Values.secrets.data.TEAM_CLOUD_CASDOOR_CLIENT_SECRET | quote }}
  TEAM_CLOUD_SPICEDB_PRESHARED_KEY: {{ .Values.secrets.data.TEAM_CLOUD_SPICEDB_PRESHARED_KEY | quote }}
  TEAM_CLOUD_MINIO_SECRET_KEY: {{ .Values.secrets.data.TEAM_CLOUD_MINIO_SECRET_KEY | quote }}
  TEAM_CLOUD_ENCRYPTION_KEY: {{ .Values.secrets.data.TEAM_CLOUD_ENCRYPTION_KEY | quote }}
{{- end }}

