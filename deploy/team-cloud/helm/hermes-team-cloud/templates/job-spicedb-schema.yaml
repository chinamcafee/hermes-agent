{{- if .Values.jobs.spicedbSchema.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hermes-team-cloud.fullname" . }}-spicedb-schema
  labels:
    {{- include "hermes-team-cloud.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: {{ .Values.jobs.spicedbSchema.ttlSecondsAfterFinished }}
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: spicedb-schema
          image: "{{ .Values.images.spicedb.repository }}:{{ .Values.images.spicedb.tag }}"
          imagePullPolicy: {{ .Values.images.spicedb.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - echo "Apply SpiceDB schema from ConfigMap {{ .Values.jobs.spicedbSchema.schemaConfigMap }}"
          env:
            - name: TEAM_CLOUD_SPICEDB_PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "hermes-team-cloud.secretName" . }}
                  key: TEAM_CLOUD_SPICEDB_PRESHARED_KEY
{{- end }}

