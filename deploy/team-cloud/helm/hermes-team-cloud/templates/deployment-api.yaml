apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hermes-team-cloud.fullname" . }}-api
  labels:
    {{- include "hermes-team-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hermes-team-cloud.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "hermes-team-cloud.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: team-api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.api.port }}
          envFrom:
            - configMapRef:
                name: {{ include "hermes-team-cloud.fullname" . }}-config
          env:
            - name: TEAM_CLOUD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "hermes-team-cloud.secretName" . }}
                  key: TEAM_CLOUD_DATABASE_URL
            - name: TEAM_CLOUD_CASDOOR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "hermes-team-cloud.secretName" . }}
                  key: TEAM_CLOUD_CASDOOR_CLIENT_SECRET
            - name: TEAM_CLOUD_SPICEDB_PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "hermes-team-cloud.secretName" . }}
                  key: TEAM_CLOUD_SPICEDB_PRESHARED_KEY
            - name: TEAM_CLOUD_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "hermes-team-cloud.secretName" . }}
                  key: TEAM_CLOUD_MINIO_SECRET_KEY
            - name: TEAM_CLOUD_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "hermes-team-cloud.secretName" . }}
                  key: TEAM_CLOUD_ENCRYPTION_KEY
          volumeMounts:
            - name: backup-storage
              mountPath: {{ .Values.persistence.backup.mountPath }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 6
      volumes:
        - name: backup-storage
          persistentVolumeClaim:
            claimName: {{ include "hermes-team-cloud.backupPvcName" . }}

