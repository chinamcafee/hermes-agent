apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hermes-team-cloud.fullname" . }}-worker
  labels:
    {{- include "hermes-team-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hermes-team-cloud.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "hermes-team-cloud.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: team-worker
          image: "{{ .Values.images.worker.repository }}:{{ .Values.images.worker.tag }}"
          imagePullPolicy: {{ .Values.images.worker.pullPolicy }}
          command: ["python", "-m", "team_cloud.worker"]
          envFrom:
            - configMapRef:
                name: {{ include "hermes-team-cloud.fullname" . }}-config
          env:
            - name: TEAM_CLOUD_BACKUP_MOUNT_PATH
              value: {{ .Values.persistence.backup.mountPath | quote }}
            - name: TEAM_CLOUD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "hermes-team-cloud.secretName" . }}
                  key: TEAM_CLOUD_DATABASE_URL
            - name: TEAM_CLOUD_SPICEDB_PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "hermes-team-cloud.secretName" . }}
                  key: TEAM_CLOUD_SPICEDB_PRESHARED_KEY
          volumeMounts:
            - name: backup-storage
              mountPath: {{ .Values.persistence.backup.mountPath }}
      volumes:
        - name: backup-storage
          persistentVolumeClaim:
            claimName: {{ include "hermes-team-cloud.backupPvcName" . }}

