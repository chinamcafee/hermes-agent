apiVersion: v1
kind: Secret
metadata:
  name: hermes-team-cloud-go-secrets
type: Opaque
stringData:
  TEAM_CLOUD_DATABASE_URL: postgres://hermes:change-me@postgres:5432/hermes_team_cloud?sslmode=require
  TEAM_CLOUD_REDIS_PASSWORD: change-me-before-deploy
  TEAM_CLOUD_AUTHZ_TOKEN: change-me-before-deploy
  TEAM_CLOUD_BACKUP_S3_ACCESS_KEY_ID: change-me-before-deploy
  TEAM_CLOUD_BACKUP_S3_SECRET_ACCESS_KEY: change-me-before-deploy
  TEAM_CLOUD_BACKUP_ENCRYPTION_KEY: change-me-before-deploy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-team-cloud-go-authz-schema
data:
  schema.json: |
    {"schema":"definition member {}\n\ndefinition organization {\n  relation owner: member\n  relation admin: member\n  relation member: member\n  relation reviewer: member\n  permission manage = owner + admin\n  permission read = owner + admin + member + reviewer\n  permission read_team = read\n  permission write_team = owner + admin\n  permission review = owner + admin + reviewer\n  permission run_agent = owner + admin + member\n  permission use = owner + admin + member\n}\n"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-team-cloud-go
  labels:
    app.kubernetes.io/name: hermes-team-cloud-go
    app.kubernetes.io/component: team-cloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-team-cloud-go
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-team-cloud-go
        app.kubernetes.io/component: team-cloud
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: spicedb-schema
          image: curlimages/curl:8.11.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - |
              until curl -fsS -X POST "${TEAM_CLOUD_AUTHZ_ENDPOINT}/v1/schema/write" \
                -H "Authorization: Bearer ${TEAM_CLOUD_AUTHZ_TOKEN}" \
                -H "Content-Type: application/json" \
                --data-binary @/authz-schema/schema.json; do
                sleep 2
              done
          env:
            - name: TEAM_CLOUD_AUTHZ_ENDPOINT
              value: http://spicedb:8443
            - name: TEAM_CLOUD_AUTHZ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-team-cloud-go-secrets
                  key: TEAM_CLOUD_AUTHZ_TOKEN
          volumeMounts:
            - name: authz-schema
              mountPath: /authz-schema
              readOnly: true
      containers:
        - name: team-cloud-go
          image: ghcr.io/hermes-agent/team-cloud-go:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8780
          env:
            - name: TEAM_CLOUD_SERVICE_NAME
              value: hermes-team-cloud-go
            - name: TEAM_CLOUD_BIND_ADDR
              value: :8780
            - name: TEAM_CLOUD_AUTO_MIGRATE
              value: "true"
            - name: TEAM_CLOUD_REDIS_ADDR
              value: redis:6379
            - name: TEAM_CLOUD_REDIS_DB
              value: "0"
            - name: TEAM_CLOUD_SESSION_TTL_SECONDS
              value: "43200"
            - name: TEAM_CLOUD_CASDOOR_ISSUER
              value: https://casdoor.example
            - name: TEAM_CLOUD_CASDOOR_AUDIENCE
              value: hermes-team-cloud
            - name: TEAM_CLOUD_CASDOOR_JWKS_URL
              value: https://casdoor.example/.well-known/jwks
            - name: TEAM_CLOUD_AUTHZ_MODE
              value: spicedb_http
            - name: TEAM_CLOUD_AUTHZ_ENDPOINT
              value: http://spicedb:8443
            - name: TEAM_CLOUD_BACKUP_OBJECT_MODE
              value: database
            - name: TEAM_CLOUD_BACKUP_S3_ENDPOINT
              value: ""
            - name: TEAM_CLOUD_BACKUP_S3_BUCKET
              value: hermes-team-memory-backups
            - name: TEAM_CLOUD_BACKUP_S3_REGION
              value: us-east-1
            - name: TEAM_CLOUD_BACKUP_SCHEDULER_ENABLED
              value: "true"
            - name: TEAM_CLOUD_BACKUP_SCHEDULER_INTERVAL_SECONDS
              value: "3600"
            - name: TEAM_CLOUD_DASHBOARD_ENABLED
              value: "true"
            - name: TEAM_CLOUD_DASHBOARD_DIR
              value: /usr/share/team-cloud-go/dashboard
            - name: TEAM_CLOUD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hermes-team-cloud-go-secrets
                  key: TEAM_CLOUD_DATABASE_URL
            - name: TEAM_CLOUD_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-team-cloud-go-secrets
                  key: TEAM_CLOUD_REDIS_PASSWORD
            - name: TEAM_CLOUD_AUTHZ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-team-cloud-go-secrets
                  key: TEAM_CLOUD_AUTHZ_TOKEN
            - name: TEAM_CLOUD_BACKUP_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: hermes-team-cloud-go-secrets
                  key: TEAM_CLOUD_BACKUP_S3_ACCESS_KEY_ID
                  optional: true
            - name: TEAM_CLOUD_BACKUP_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-team-cloud-go-secrets
                  key: TEAM_CLOUD_BACKUP_S3_SECRET_ACCESS_KEY
                  optional: true
            - name: TEAM_CLOUD_BACKUP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-team-cloud-go-secrets
                  key: TEAM_CLOUD_BACKUP_ENCRYPTION_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: authz-schema
          configMap:
            name: hermes-team-cloud-go-authz-schema
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-team-cloud-go
  labels:
    app.kubernetes.io/name: hermes-team-cloud-go
    app.kubernetes.io/component: team-cloud
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hermes-team-cloud-go
  ports:
    - name: http
      port: 8780
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: session-store
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: session-store
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: session-store
    spec:
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
          args:
            - --appendonly
            - "yes"
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-team-cloud-go-secrets
                  key: TEAM_CLOUD_REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
